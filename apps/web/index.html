<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <script>
      (function () {
        try {
          var apply = function (mode) {
            var resolved =
              mode === "system"
                ? window.matchMedia("(prefers-color-scheme: dark)").matches
                  ? "dark"
                  : "light"
                : mode;
            var root = document.documentElement;
            root.style.colorScheme = resolved;
            root.dataset.kbTheme = resolved;
            return mode;
          };
          var stored = localStorage.getItem("kb-color-mode");
          if (stored) apply(stored);
          else localStorage.setItem("kb-color-mode", apply("dark"));
        } catch (e) {}

        if (window.desktop) {
          document.documentElement.dataset.platform = window.desktop.platform;
          if (window.desktop.platform === "darwin") {
            document.documentElement.dataset.boot = "1";
          }
        }
      })();
    </script>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: none;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }

      html[data-boot="1"] #boot-splash {
        display: flex;
      }

      #boot-splash svg {
        width: 48px;
        height: 48px;
      }
    </style>
    <link href="/src/index.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  </head>
