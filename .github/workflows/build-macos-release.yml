name: Build signed macOS release
on:
  workflow_dispatch:
    inputs:
      release_feed:
        description: 'HTTPS UVE update endpoint (optional; no automatic publishing)'
        required: false
        type: string
      release_feed_type:
        description: 'Update feed format: dynamic endpoint or static Squirrel JSON'
        required: true
        default: default
        type: choice
        options:
          - default
          - json
      instagram_auth_url:
        description: 'HTTPS Instagram authorization service origin (optional; no secrets)'
        required: false
        type: string
      private_download_url:
        description: 'Private GitHub repository releases page (optional; opened using the browser login)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  signed-macos:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CUTROOM_RELEASE: '1'
      CUTROOM_SIGN_IDENTITY: ${{ secrets.CUTROOM_SIGN_IDENTITY }}
      CUTROOM_SIGN_KEYCHAIN: ${{ runner.temp }}/uve-signing.keychain-db
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      CUTROOM_UPDATE_FEED_URL: ${{ inputs.release_feed }}
      CUTROOM_UPDATE_FEED_TYPE: ${{ inputs.release_feed_type }}
      UVE_INSTAGRAM_AUTH_URL: ${{ inputs.instagram_auth_url }}
      CUTROOM_PRIVATE_DOWNLOAD_URL: ${{ inputs.private_download_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate release settings and runner architecture
        run: |
          set -euo pipefail
          node --input-type=module -e 'if (process.platform !== "darwin" || process.arch !== "arm64") throw new Error("This workflow builds Apple Silicon releases and requires an arm64 macOS runner.")'
          node apps/desktop/scripts/build-release-config.mjs
      - name: Import Developer ID certificate into a temporary keychain
        env:
          SIGNING_P12: ${{ secrets.CUTROOM_SIGNING_P12_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.CUTROOM_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_P12"
          test -n "$CUTROOM_SIGN_IDENTITY"
          TASK_KEYCHAIN="$CUTROOM_SIGN_KEYCHAIN"
          TASK_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$TASK_PASSWORD"
          printf '%s' "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/uve-signing.p12"
          security create-keychain -p "$TASK_PASSWORD" "$TASK_KEYCHAIN"
          security set-keychain-settings -lut 3600 "$TASK_KEYCHAIN"
          security unlock-keychain -p "$TASK_PASSWORD" "$TASK_KEYCHAIN"
          security import "$RUNNER_TEMP/uve-signing.p12" -P "$SIGNING_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$TASK_KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$TASK_PASSWORD" "$TASK_KEYCHAIN"
          # codesign --keychain selects the identity; chain certificates still
          # come from the search list. Preserve the runner's existing keychains.
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const keychain = process.env.CUTROOM_SIGN_KEYCHAIN;
          const existing = [...execFileSync('security', ['list-keychains', '-d', 'user'], { encoding: 'utf8' }).matchAll(/"([^"]+)"/g)].map(match => match[1]);
          execFileSync('security', ['list-keychains', '-d', 'user', '-s', keychain, ...existing.filter(path => path !== keychain)]);
          NODE
          rm "$RUNNER_TEMP/uve-signing.p12"
      - run: npm ci
      - run: npm run setup:speech
      - run: node apps/desktop/scripts/build-audio-tools.mjs
      - run: npm run check
      - run: npm test
      - run: npm run make
      - name: Verify signature and notarization
        run: |
          set -euo pipefail
          TASK_APP="apps/desktop/out/Cutroom-darwin-$(node -p process.arch)/Cutroom.app"
          TASK_ZIP="$(node --input-type=module -e 'import { globSync } from "node:fs"; const paths = globSync("apps/desktop/out/make/**/*.zip"); if (paths.length !== 1) throw new Error("Expected one update archive."); console.log(paths[0]);')"
          TASK_DMG="$(node --input-type=module -e 'import { globSync } from "node:fs"; const paths = globSync("apps/desktop/out/make/**/*.dmg"); if (paths.length !== 1) throw new Error("Expected one installer."); console.log(paths[0]);')"
          node scripts/verify-standalone-bundle.mjs "$TASK_APP" arm64 --output apps/desktop/out/make/bundle-verification.json
          node scripts/verify-macos-release.mjs --app "$TASK_APP" --zip "$TASK_ZIP" --dmg "$TASK_DMG" --team "$APPLE_TEAM_ID" --output apps/desktop/out/make/release-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: signed-macos-release-arm64
          path: apps/desktop/out/make/
          if-no-files-found: error
      - name: Remove temporary signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/uve-signing.p12"
          security delete-keychain "$CUTROOM_SIGN_KEYCHAIN" || true
